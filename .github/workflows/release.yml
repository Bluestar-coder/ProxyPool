name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate icon files
        run: uv run python scripts/make_icons.py

      - name: Build app bundle
        run: uv run pyinstaller ProxyPool.spec --noconfirm

      - name: Create DMG
        run: |
          hdiutil create -volname "ProxyPool" \
            -srcfolder dist/ProxyPool.app \
            -ov -format UDZO \
            dist/ProxyPool-mac.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPool-mac
          path: dist/ProxyPool-mac.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Generate icon files
        run: uv run python scripts/make_icons.py

      - name: Build executable
        run: uv run pyinstaller ProxyPool.spec --noconfirm

      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path dist\ProxyPool\* -DestinationPath dist\ProxyPool-windows.zip

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPool-windows
          path: dist/ProxyPool-windows.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Resolve version tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxyPool-mac
          path: artifacts

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ProxyPool-windows
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: "ProxyPool ${{ steps.ver.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
